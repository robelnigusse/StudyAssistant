
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: roba
      POSTGRES_DB: StudyAssistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Override the DB_URL to point to the docker-compose 'db' service instead of localhost
      - DB_URL=postgresql+psycopg://postgres:roba@db:5432/StudyAssistant
    env_file:
      - ./backend/.env
    volumes:
      # Persist ChromaDB data to a docker volume
      - chroma_data:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Map the Nginx server on port 80 to your local port 5173
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
